<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#dfe5ec;overflow:hidden}</style></head>
<body><script type="module">
// 캐릭터 GLB 미리보기 (개발용): ?model=경로&views=front,side,back&clip=Walk&t=0.3&pose=...
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const views = (q.get('views') ?? 'front,side,back,quarter').split(',');
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe5ec);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;
scene.add(new THREE.HemisphereLight(0xf4f8ff, 0xcbb89a, 0.85));
const sun = new THREE.DirectionalLight(0xffeccc, 2.6);
sun.position.set(2, 4, 3);
sun.castShadow = true;
scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.MeshStandardMaterial({ color: 0xcfd6de, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const gltf = await new GLTFLoader().loadAsync(q.get('model'));
const root = gltf.scene;
scene.add(root);
root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; if (!o.geometry.getAttribute('normal')) o.geometry.computeVertexNormals(); } });
{ const b0 = new THREE.Box3().setFromObject(root); root.position.y -= b0.min.y; }
if (q.get('ry')) root.rotation.y = Number(q.get('ry'));
let mixer = null;
if (q.get('clip')) {
  const clip = gltf.animations.find((a) => a.name === q.get('clip'));
  if (clip) { mixer = new THREE.AnimationMixer(root); mixer.clipAction(clip).play(); mixer.setTime(Number(q.get('t') ?? 0) * clip.duration); }
  else document.title = 'NOCLIP';
}
root.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(root);
const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
const zoom = q.get('zoom') === 'face';
const target = zoom ? new THREE.Vector3(c.x, box.max.y - size.y * 0.14, c.z) : new THREE.Vector3(c.x, box.min.y + size.y * 0.5, c.z);
const dist = zoom ? size.y * 0.75 : size.y * 1.9;
const dirs = { front: [0, 0.1, 1], back: [0, 0.1, -1], side: [1, 0.1, 0], left: [-1, 0.1, 0], quarter: [0.7, 0.25, 0.8], backq: [-0.7, 0.25, -0.8], top: [0.01, 1, 0.3] };
const cam = new THREE.PerspectiveCamera(30, (W / views.length) / H, 0.05, 50);
renderer.setScissorTest(true);
views.forEach((v, i) => {
  const d = new THREE.Vector3(...(dirs[v] ?? dirs.front)).normalize();
  cam.position.copy(target).addScaledVector(d, dist);
  cam.lookAt(target);
  const x = (W / views.length) * i;
  renderer.setViewport(x, 0, W / views.length, H);
  renderer.setScissor(x, 0, W / views.length, H);
  renderer.render(scene, cam);
});
window.__info = { tris: renderer.info.render.triangles / views.length, size: size.toArray(), min: box.min.toArray(), clips: gltf.animations.map((a) => `${a.name}:${a.duration.toFixed(2)}`), bones: (() => { let n = 0; root.traverse((o) => o.isBone && n++); return n; })() };
document.title = document.title === 'NOCLIP' ? 'NOCLIP' : 'READY';
</script></body></html>
